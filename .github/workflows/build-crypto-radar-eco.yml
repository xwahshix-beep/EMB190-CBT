name: Build Explosion Radar V5.2 Recovery APK

on:
  push:
    branches: [ crypto-scanner-apk-build ]
    paths:
      - 'crypto-radar-lowpower/**'
      - '.github/workflows/build-crypto-radar-eco.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: V4.1 foundation
        working-directory: crypto-radar-lowpower
        run: python3 patch_v4.py
      - name: V4.2 Hybrid Early Hunt
        working-directory: crypto-radar-lowpower
        run: python3 patch_v42.py
      - name: V4.2.1 dashboard
        working-directory: crypto-radar-lowpower
        run: python3 patch_ui_v421.py
      - name: V4.2.2 BUY display
        working-directory: crypto-radar-lowpower
        run: python3 patch_v422.py
      - name: V4.2.3 revalidation
        working-directory: crypto-radar-lowpower
        run: python3 patch_v423.py
      - name: V4.2.4 interface
        working-directory: crypto-radar-lowpower
        run: python3 patch_v424.py
      - name: V4.3 Exit Manager
        working-directory: crypto-radar-lowpower
        run: python3 patch_v43.py
      - name: V4.3.1 alerts base
        working-directory: crypto-radar-lowpower
        run: python3 patch_v431.py
      - name: V4.4 Trade Manager
        working-directory: crypto-radar-lowpower
        run: python3 patch_v44.py
      - name: V5.2 Recovery lock only
        working-directory: crypto-radar-lowpower
        run: python3 patch_v5.py
      - name: Build V5.2 Recovery
        working-directory: crypto-radar-lowpower
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Rename APK
        run: cp crypto-radar-lowpower/app/build/outputs/apk/debug/app-debug.apk Explosion-Radar-V5.2-Recovery.apk
      - name: Verify APK icon metadata signature
        run: |
          test -s Explosion-Radar-V5.2-Recovery.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Explosion-Radar-V5.2-Recovery.apk | tee apk-metadata.txt
          grep -q "versionName='5.2-recovery'" apk-metadata.txt
          grep -q "application-icon" apk-metadata.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Explosion-Radar-V5.2-Recovery.apk
          sha256sum Explosion-Radar-V5.2-Recovery.apk > Explosion-Radar-V5.2-Recovery.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Explosion-Radar-V5.2-Recovery-APK
          path: |
            Explosion-Radar-V5.2-Recovery.apk
            Explosion-Radar-V5.2-Recovery.apk.sha256
            apk-metadata.txt
          retention-days: 7
