name: Build Hybrid Explosion Radar V4.2.1 APK

on:
  push:
    branches: [ crypto-scanner-apk-build ]
    paths:
      - 'crypto-radar-lowpower/**'
      - '.github/workflows/build-crypto-radar-eco.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Integrate V4.1 background wake foundation
        working-directory: crypto-radar-lowpower
        run: python3 patch_v4.py
      - name: Integrate V4.2 Hybrid Early Hunt engine
        working-directory: crypto-radar-lowpower
        run: python3 patch_v42.py
      - name: Apply V4.2.1 candidate-first dashboard
        working-directory: crypto-radar-lowpower
        run: python3 patch_ui_v421.py
      - name: Build Hybrid Explosion Radar V4.2.1 APK
        working-directory: crypto-radar-lowpower
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Rename APK
        run: cp crypto-radar-lowpower/app/build/outputs/apk/debug/app-debug.apk Hybrid-Explosion-Radar-V4.2.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Hybrid-Explosion-Radar-V4.2.1-APK
          path: Hybrid-Explosion-Radar-V4.2.1.apk
          retention-days: 7
