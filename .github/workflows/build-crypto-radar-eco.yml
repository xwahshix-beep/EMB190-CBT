name: Build Free Whale Radar V3 APK

on:
  push:
    branches: [ crypto-scanner-apk-build ]
    paths:
      - 'crypto-radar-lowpower/**'
      - '.github/workflows/build-crypto-radar-eco.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Free Whale Radar V3 APK
        working-directory: crypto-radar-lowpower
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Rename APK
        run: cp crypto-radar-lowpower/app/build/outputs/apk/debug/app-debug.apk Free-Whale-Radar-V3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Free-Whale-Radar-V3-APK
          path: Free-Whale-Radar-V3.apk
          retention-days: 7
