name: Build EMB190 CBT APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BUILD_TRIGGER.txt'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 35
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download all CBT release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf flat-assets app/src/main/assets
          mkdir -p flat-assets app/src/main/assets
          gh release download Emp190 --dir flat-assets
          test -f flat-assets/offline-files.json
          echo "Downloaded $(find flat-assets -maxdepth 1 -type f | wc -l) release assets"

      - name: Restore original CBT folder structure
        run: |
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path

          flat = Path('flat-assets')
          out = Path('app/src/main/assets')
          paths = json.loads((flat / 'offline-files.json').read_text(encoding='utf-8'))

          missing = []
          for rel in paths:
              src = flat / Path(rel).name
              dst = out / rel
              if not src.exists():
                  missing.append(rel)
                  continue
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)

          for name in ['offline-files.json', 'README-AR.md', 'INSPECTION-AR.md', 'server.py']:
              src = flat / name
              if src.exists():
                  shutil.copy2(src, out / name)

          if missing:
              print('Missing assets:')
              print('\n'.join(missing[:100]))
              raise SystemExit(f'{len(missing)} required CBT files are missing')

          required = [
              out / 'index.html',
              out / 'app.js',
              out / 'catalog.js',
              out / 'Data' / 'Data.txt',
              out / 'ruffle' / 'ruffle.js',
              out / 'Start.swf',
          ]
          for p in required:
              if not p.exists():
                  raise SystemExit(f'Required file not found after reconstruction: {p}')

          files = [p for p in out.rglob('*') if p.is_file()]
          print(f'Reconstructed {len(files)} CBT files')
          PY

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk EMB190-CBT.apk
          ls -lh EMB190-CBT.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EMB190-CBT-APK
          path: EMB190-CBT.apk
          retention-days: 7
