name: Build EMB190 CBT APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BUILD_TRIGGER.txt'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download CBT package from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download Emp190 -p 'EMB190-Mobile.zip'
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets
          unzip -q EMB190-Mobile.zip -d app/src/main/assets
          if [ ! -f app/src/main/assets/index.html ]; then
            echo 'index.html not found after extraction'
            exit 1
          fi

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk EMB190-CBT.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EMB190-CBT-APK
          path: EMB190-CBT.apk
