name: Build Crypto Explosion Radar APK

on:
  push:
    branches: [ crypto-scanner-apk-build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore scanner source
        run: |
          mkdir -p scanner
          echo '' | base64 -d > /tmp/scanner.tgz
          tar -xzf /tmp/scanner.tgz -C scanner
      - name: Build APK
        working-directory: scanner
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Rename APK
        run: cp scanner/app/build/outputs/apk/debug/app-debug.apk Crypto-Explosion-Radar.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Crypto-Explosion-Radar-APK
          path: Crypto-Explosion-Radar.apk
          retention-days: 7
