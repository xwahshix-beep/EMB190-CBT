name: Build Explosion Radar V6 APK
on:
  push:
    branches: [crypto-scanner-apk-build]
    paths: ['crypto-radar-lowpower/**', '.github/workflows/build-v53.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: explosion-radar-crypto-scanner-apk-build
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/crypto-scanner-apk-build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test native engine and state regressions
        working-directory: crypto-radar-lowpower
        run: |
          curl --fail --retry 2 -o /tmp/json.jar https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar
          bash tests/run-v6.sh /tmp/json.jar
      - name: Reproduce packaged historical results
        working-directory: crypto-radar-lowpower
        run: |
          java -cp /tmp/v6tests com.wahshi.cryptoexplosionradar.ReplayCli app/src/main/assets/replay /tmp/results.csv /tmp/alerts.csv
          diff research/v6-results.csv /tmp/results.csv
          diff research/v6-alerts.csv /tmp/alerts.csv
      - name: Build native Android V6
        working-directory: crypto-radar-lowpower
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Verify APK package, version, signature, and replay assets
        run: |
          cp crypto-radar-lowpower/app/build/outputs/apk/debug/app-debug.apk Explosion-Radar-V6.apk
          test -s Explosion-Radar-V6.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Explosion-Radar-V6.apk | tee apk-metadata.txt
          grep -q "name='com.wahshi.cryptoexplosionradar'" apk-metadata.txt
          grep -q "versionName='6.0.1-early-watch'" apk-metadata.txt
          grep -q "application-icon" apk-metadata.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Explosion-Radar-V6.apk | tee signature.txt
          python3 crypto-radar-lowpower/tests/verify-apk-assets.py Explosion-Radar-V6.apk
          sha256sum Explosion-Radar-V6.apk > Explosion-Radar-V6.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Explosion-Radar-V6-APK
          if-no-files-found: error
          path: |
            Explosion-Radar-V6.apk
            Explosion-Radar-V6.apk.sha256
            apk-metadata.txt
            signature.txt
            crypto-radar-lowpower/research/v6-results.csv
            crypto-radar-lowpower/research/v6-alerts.csv
          retention-days: 30
