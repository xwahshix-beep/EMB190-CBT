name: Build AERO FUSION APK
on:
  workflow_dispatch:
  push:
    branches: [aero-fusion]
    paths: ['AERO_BUILD_TRIGGER.txt']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon assembleDebug --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk AERO-FUSION.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AERO-FUSION-APK
          path: AERO-FUSION.apk
          retention-days: 7
