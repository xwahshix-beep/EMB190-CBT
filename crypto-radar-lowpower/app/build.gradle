plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wahshi.cryptoexplosionradar'
    compileSdk 35

    defaultConfig {
        manifestPlaceholders = [appLabel: "Explosion Radar"]
        applicationId 'com.wahshi.cryptoexplosionradar'
        minSdk 26
        targetSdk 34
        versionCode 79
        versionName "6.12.0-research"
    }

    buildTypes {
        research {
            initWith debug
            debuggable false
            applicationIdSuffix '.research612'
            manifestPlaceholders = [appLabel: "Explosion Radar 6.12"]
            matchingFallbacks = ['debug']
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation "com.squareup.okhttp3:okhttp:4.12.0" }
