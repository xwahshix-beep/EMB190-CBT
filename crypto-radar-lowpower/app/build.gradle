plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wahshi.cryptoexplosionradar'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wahshi.cryptoexplosionradar'
        minSdk 26
        targetSdk 34
        versionCode 66
        versionName "6.3-streams"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation "com.squareup.okhttp3:okhttp:4.12.0" }
