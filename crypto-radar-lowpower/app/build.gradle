plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wahshi.cryptoexplosionradar'
    compileSdk 35

    defaultConfig {
        manifestPlaceholders = [appLabel: "Explosion Radar"]
        applicationId 'com.wahshi.cryptoexplosionradar'
        minSdk 26
        targetSdk 34
        versionCode 80
        versionName "6.12-engineering"
    }

    buildTypes {
        engineering {
            initWith debug
            debuggable false
            minifyEnabled false
            shrinkResources false
            applicationIdSuffix '.engineering612'
            manifestPlaceholders = [appLabel: "Explosion Radar 6.12 Engineering"]
            matchingFallbacks = ['debug']
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation "com.squareup.okhttp3:okhttp:4.12.0" }
